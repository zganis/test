name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with local dist server
        shell: bash
        run: |
          cd dist
          python -m http.server 8000 > ../http-server.log 2>&1 &
          SERVER_PID=$!
          cd ..

          trap "kill $SERVER_PID" EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:8000"
          for _ in range(30):
              try:
                  urllib.request.urlopen(url, timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Local test server did not start")
          PY

          pytest -q
